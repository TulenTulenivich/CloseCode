<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7f3" />
    <title>CloseCode — превью</title>
    <style>
      html,
      body {
        background: #f7f7f3;
      }

      .preview-badge {
        position: fixed;
        top: 14px;
        right: 16px;
        z-index: 60;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 24px;
        padding: 0 9px;
        border: 1px solid #e6e6de;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.86);
        color: #82827a;
        font: 10.5px/1 'Segoe UI', system-ui, sans-serif;
        letter-spacing: 0.02em;
        box-shadow: 0 2px 8px rgba(35, 45, 40, 0.06);
        backdrop-filter: blur(8px);
        pointer-events: none;
      }

      .preview-badge b {
        color: #266b52;
        font-weight: 600;
      }

      @media (max-width: 980px) {
        .preview-badge {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div class="preview-badge" title="Ответы имитируются, запросы к API не отправляются">
      <b>Превью</b> · демо-ответы
    </div>
    <script type="module" src="/src/preview/main.tsx"></script>
  </body>
</html>
